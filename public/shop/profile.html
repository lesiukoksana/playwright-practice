<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | PracticeShop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/test-hooks.js"></script>
  <script type="module" src="js/pages/profile.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main id="main" class="container narrow">
    <h1>My profile</h1>

    <section class="card" aria-labelledby="avatar-heading">
      <h2 id="avatar-heading">Profile picture</h2>
      <div class="avatar-row">
        <div id="avatar-preview" class="avatar-lg" data-testid="avatar-preview"></div>
        <div>
          <label for="avatar-input" class="btn btn-secondary">Upload picture</label>
          <input id="avatar-input" type="file" accept="image/png,image/jpeg" class="visually-hidden" aria-describedby="avatar-hint avatar-input-error">
          <button type="button" class="link-button danger" id="remove-avatar" hidden>Remove picture</button>
          <p class="hint" id="avatar-hint">PNG or JPEG, up to 1 MB.</p>
          <p class="error" id="avatar-input-error" hidden></p>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="details-heading">
      <h2 id="details-heading">Personal details</h2>
      <form id="details-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="first-name">First name</label>
            <input id="first-name" autocomplete="given-name" aria-describedby="first-name-error">
            <p class="error" id="first-name-error" hidden></p>
          </div>
          <div class="field">
            <label for="last-name">Last name</label>
            <input id="last-name" autocomplete="family-name" aria-describedby="last-name-error">
            <p class="error" id="last-name-error" hidden></p>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" readonly aria-describedby="email-hint">
          <p class="hint" id="email-hint">Email cannot be changed.</p>
        </div>
        <div class="field">
          <label for="phone">Phone number <span class="muted">(optional)</span></label>
          <input id="phone" type="tel" autocomplete="tel" aria-describedby="phone-error">
          <p class="error" id="phone-error" hidden></p>
        </div>
        <p id="unsaved" class="info-note" data-testid="unsaved-changes" hidden>You have unsaved changes.</p>
        <button type="submit" class="btn btn-primary" id="save-details">Save changes</button>
      </form>
    </section>

    <section class="card" aria-labelledby="password-heading">
      <h2 id="password-heading">Change password</h2>
      <form id="password-form" novalidate>
        <div class="field">
          <label for="current-password">Current password</label>
          <input id="current-password" type="text" class="masked" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore aria-describedby="current-password-error">
          <p class="error" id="current-password-error" hidden></p>
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" type="text" class="masked" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore aria-describedby="new-password-rules new-password-error">
          <ul class="rules" id="new-password-rules" aria-label="Password requirements"></ul>
          <p class="error" id="new-password-error" hidden></p>
        </div>
        <div class="field">
          <label for="confirm-new-password">Confirm new password</label>
          <input id="confirm-new-password" type="text" class="masked" autocomplete="off" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore aria-describedby="confirm-new-password-error">
          <p class="error" id="confirm-new-password-error" hidden></p>
        </div>
        <button type="submit" class="btn btn-primary">Update password</button>
      </form>
    </section>

    <section class="card danger-zone" aria-labelledby="danger-heading">
      <h2 id="danger-heading">Delete account</h2>
      <p>This permanently deletes your account, cart, wishlist and order history.</p>
      <button type="button" class="btn btn-danger" id="delete-account">Delete my account</button>
    </section>
  </main>
  <div id="app-footer"></div>
</body>
</html>
